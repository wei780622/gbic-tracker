<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBIC 追蹤系統</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; color: #333; }
    .page { display: none; padding: 20px; min-height: 100vh; flex-direction: column; }
    .page.active { display: flex; }
    h1 { font-size: 22px; margin-bottom: 24px; color: #1a73e8; }
    h2 { font-size: 18px; margin-bottom: 16px; color: #333; }
    .btn {
      display: block; width: 100%; padding: 16px; margin: 8px 0;
      background: #1a73e8; color: white; border: none; border-radius: 10px;
      font-size: 17px; cursor: pointer; text-align: center; font-weight: 500;
    }
    .btn:active { opacity: 0.85; }
    .btn-green { background: #0f9d58; }
    .btn-grey  { background: #757575; }
    .form-group { margin: 14px 0; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
    input[type=text], select {
      width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px; background: white; -webkit-appearance: none;
    }
    #scanner-wrap {
      position: relative; width: 100%; background: #000;
      border-radius: 10px; overflow: hidden; margin: 10px 0;
      aspect-ratio: 1;
    }
    #scanner-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #scanner-canvas { display: none; }
    .scan-frame {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 60%; aspect-ratio: 1; border: 3px solid #1a73e8; border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }
    .hint { text-align: center; color: #888; font-size: 13px; margin: 4px 0 8px; }
    .card { background: white; border-radius: 10px; padding: 16px; margin: 10px 0; }
    .card p { margin: 5px 0; font-size: 14px; line-height: 1.5; }
    .card .lbl { color: #888; }
    .tag-out { color: #d93025; font-weight: 600; }
    .tag-in  { color: #0f9d58; font-weight: 600; }
    .err { color: #d93025; font-size: 13px; margin: 6px 0; min-height: 18px; }
    .big-check { font-size: 72px; text-align: center; margin: 24px 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f0f4ff; font-weight: 600; white-space: nowrap; }
    hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }
    .no-data { color: #888; font-size: 14px; text-align: center; padding: 16px; }

    /* Scanned list chips */
    #scanned-list { margin: 8px 0; }
    .chip {
      display: flex; align-items: center; justify-content: space-between;
      background: white; border-radius: 8px; padding: 10px 12px;
      margin: 6px 0; font-size: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .chip-info { flex: 1; }
    .chip-barcode { font-weight: 600; color: #333; }
    .chip-model { font-size: 12px; color: #888; margin-top: 2px; }
    .chip-del { background: none; border: none; color: #d93025; font-size: 20px;
                cursor: pointer; padding: 0 4px; line-height: 1; }
    .scan-count { font-size: 13px; color: #1a73e8; font-weight: 600; text-align: center; margin: 4px 0; }

    /* Batch form item rows */
    .batch-item {
      background: white; border-radius: 8px; padding: 12px;
      margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .batch-item-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .batch-item-barcode { font-weight: 600; font-size: 14px; }
    .batch-item-model { font-size: 12px; color: #888; }
    .batch-item select { font-size: 14px; padding: 8px 10px; }
  </style>
</head>
<body>

<!-- Page: Main -->
<div id="pg-main" class="page active">
  <h1>📡 GBIC 追蹤系統</h1>
  <button class="btn"           onclick="startAction('領出')">📤 領出 GBIC</button>
  <button class="btn btn-green" onclick="startAction('歸還')">📥 歸還 GBIC</button>
  <div id="admin-btn-wrap"></div>
</div>

<!-- Page: Scan (batch) -->
<div id="pg-scan" class="page">
  <h2 id="scan-title">掃描 GBIC 條碼</h2>
  <div id="scanner-wrap">
    <video id="scanner-video" autoplay playsinline muted></video>
    <canvas id="scanner-canvas"></canvas>
    <div class="scan-frame"></div>
  </div>
  <p class="hint">將條碼對準框內，可連續掃多個</p>
  <div class="scan-count" id="scan-count"></div>
  <div id="scanned-list"></div>
  <button class="btn btn-green" id="btn-done" onclick="goToBatchForm()" style="display:none">✓ 完成掃描，填寫資料</button>
  <button class="btn btn-grey" style="margin-top:4px" onclick="stopScan(); scannedItems=[]; showPage('pg-main')">取消</button>
</div>

<!-- Page: Batch Form -->
<div id="pg-batch" class="page">
  <h2 id="batch-title">領出 GBIC</h2>

  <div class="form-group">
    <label>工程師姓名</label>
    <input type="text" id="b-engineer" placeholder="請輸入姓名" autocomplete="name">
  </div>
  <div class="form-group">
    <label>機櫃編號</label>
    <select id="b-rack"><option value="">-- 請選擇 --</option></select>
  </div>
  <div class="form-group">
    <label>預設 U 數（套用到所有未設定的項目）</label>
    <select id="b-upos-default" onchange="applyDefaultU()">
      <option value="">-- 選擇預設 --</option>
    </select>
  </div>

  <hr>

  <div id="batch-items"></div>

  <p id="batch-err" class="err"></p>
  <button class="btn" onclick="submitBatch()">✓ 全部送出</button>
  <button class="btn btn-grey" onclick="showPage('pg-scan'); startScan()">← 繼續掃描</button>
</div>

<!-- Page: Success -->
<div id="pg-ok" class="page">
  <div class="big-check">✅</div>
  <h2 style="text-align:center" id="ok-title">送出成功</h2>
  <div class="card" id="ok-detail"></div>
  <button class="btn" style="margin-top:20px" onclick="resetAndHome()">再掃一批</button>
</div>

<!-- Page: Admin -->
<div id="pg-admin" class="page">
  <h2>查詢 / 匯出</h2>

  <div class="form-group">
    <label>依機櫃查詢目前在外 GBIC</label>
    <select id="a-rack"><option value="">-- 選擇機櫃 --</option></select>
  </div>
  <button class="btn" onclick="adminQueryRack()">查詢</button>
  <div id="res-rack" style="overflow-x:auto;margin-top:8px"></div>

  <hr>

  <div class="form-group">
    <label>依 GBIC 條碼查詢歷史</label>
    <input type="text" id="a-barcode" placeholder="輸入條碼">
  </div>
  <button class="btn" onclick="adminQueryBarcode()">查詢</button>
  <div id="res-barcode" style="overflow-x:auto;margin-top:8px"></div>

  <hr>

  <button class="btn btn-grey" onclick="exportCSV()">⬇ 匯出庫存快照（CSV）</button>
  <p class="hint" style="margin-top:4px">下載 .csv 檔，可用 Excel 開啟</p>

  <hr>
  <button class="btn btn-grey" onclick="showPage('pg-main')">← 返回主頁</button>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyz98FSSFpjjyAFtVgZr3eizddRYAU22Z5aM2NJgPYypXfniTI4ePoLLXTiWO2vEGRO/exec';
  const isAdmin = new URLSearchParams(window.location.search).get('mode') === 'admin';

  let currentAction = '';
  let scanStream = null;
  let scanTimer = null;
  let scannedItems = [];  // [{barcode, model}]
  let rackOptions = [];
  let uOptions = [];
  let scanCooldown = false;

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  window.onload = function () {
    if (isAdmin) {
      document.getElementById('admin-btn-wrap').innerHTML =
        '<hr><button class="btn btn-grey" onclick="showPage(\'pg-admin\')">🔍 查詢 / 匯出</button>';
    }
    callApi({ action: 'getOptions' }).then(function (data) {
      rackOptions = data.racks;
      uOptions = data.uNumbers;
      fillSelect('a-rack', rackOptions);
    }).catch(function () {
      alert('無法載入選單，請重新整理頁面');
    });
  };

  function showPage(id) {
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function fillSelect(id, values) {
    var sel = document.getElementById(id);
    var existing = sel.options.length;
    if (existing > 1) return;
    values.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  }

  function buildSelect(id, values, placeholder) {
    var html = '<select id="' + id + '"><option value="">' + placeholder + '</option>';
    values.forEach(function (v) { html += '<option value="' + esc(v) + '">' + esc(v) + '</option>'; });
    return html + '</select>';
  }

  // ── Action start ────────────────────────────────────────────────
  function startAction(action) {
    currentAction = action;
    scannedItems = [];
    document.getElementById('scan-title').textContent = '掃描 GBIC 條碼（' + action + '）';
    document.getElementById('batch-title').textContent = action + ' GBIC';
    updateScannedUI();
    showPage('pg-scan');
    startScan();
  }

  function resetAndHome() {
    scannedItems = [];
    showPage('pg-main');
  }

  // ── Scanner ─────────────────────────────────────────────────────
  function startScan() {
    var video = document.getElementById('scanner-video');
    scanCooldown = false;

    if (typeof BarcodeDetector !== 'undefined') {
      var detector = new BarcodeDetector({ formats: [
        'code_128','code_39','code_93','ean_13','ean_8',
        'upc_a','upc_e','itf','codabar','qr_code','data_matrix','pdf417'
      ]});
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function (stream) {
          scanStream = stream;
          video.srcObject = stream;
          video.play();
          scanTimer = setInterval(function () {
            if (scanCooldown) return;
            detector.detect(video).then(function (codes) {
              if (codes.length > 0) onBarcodeFound(codes[0].rawValue);
            }).catch(function () {});
          }, 300);
        })
        .catch(function () { stopScan(); showPage('pg-main'); });
      return;
    }

    if (typeof ZXing !== 'undefined') {
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,  ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,   ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX
      ]);
      var reader = new ZXing.BrowserMultiFormatReader(hints);
      reader.decodeFromVideoDevice(null, 'scanner-video', function (result) {
        if (result && !scanCooldown) onBarcodeFound(result.getText());
      });
      scanStream = { zxingReader: reader, getTracks: function () { return []; } };
      return;
    }

    // jsQR fallback
    var canvas = document.getElementById('scanner-canvas');
    var ctx = canvas.getContext('2d');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function (stream) {
        scanStream = stream; video.srcObject = stream; video.play();
        scanTimer = setInterval(function () {
          if (scanCooldown || video.readyState !== video.HAVE_ENOUGH_DATA) return;
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) onBarcodeFound(code.data);
        }, 300);
      })
      .catch(function () { stopScan(); showPage('pg-main'); });
  }

  function stopScan() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) {
      if (scanStream.zxingReader) { scanStream.zxingReader.reset(); }
      else { scanStream.getTracks().forEach(function (t) { t.stop(); }); }
      scanStream = null;
    }
  }

  function onBarcodeFound(barcode) {
    if (!barcode) return;

    if (barcode.startsWith('MT')) {
      // S/N — deduplicate
      if (scannedItems.some(function (i) { return i.barcode === barcode; })) {
        scanCooldown = true;
        setTimeout(function () { scanCooldown = false; }, 1500);
        return;
      }
      scanCooldown = true;
      if (navigator.vibrate) navigator.vibrate(80);
      var item = { barcode: barcode, model: '' };
      scannedItems.push(item);
      updateScannedUI();
      setTimeout(function () { scanCooldown = false; }, 800);
    } else {
      // P/N — assign to last S/N without a model
      var target = null;
      for (var i = scannedItems.length - 1; i >= 0; i--) {
        if (!scannedItems[i].model) { target = scannedItems[i]; break; }
      }
      if (!target) return;
      scanCooldown = true;
      if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
      target.model = barcode;
      updateScannedUI();
      setTimeout(function () { scanCooldown = false; }, 800);
    }
  }

  function removeScanned(index) {
    scannedItems.splice(index, 1);
    updateScannedUI();
  }

  function updateScannedUI() {
    var count = scannedItems.length;
    var countEl = document.getElementById('scan-count');
    var listEl  = document.getElementById('scanned-list');
    var doneBtn = document.getElementById('btn-done');

    countEl.textContent = count > 0 ? '已掃 ' + count + ' 個' : '';
    doneBtn.style.display = count > 0 ? 'block' : 'none';

    listEl.innerHTML = scannedItems.map(function (item, i) {
      return '<div class="chip">' +
        '<div class="chip-info">' +
          '<div class="chip-barcode">' + esc(item.barcode) + '</div>' +
          (item.model ? '<div class="chip-model">' + esc(item.model) + '</div>' : '') +
        '</div>' +
        '<button class="chip-del" onclick="removeScanned(' + i + ')">×</button>' +
      '</div>';
    }).join('');
  }

  // ── Batch form ──────────────────────────────────────────────────
  function goToBatchForm() {
    stopScan();
    // Build rack & U selects
    var rackSel = document.getElementById('b-rack');
    while (rackSel.options.length > 1) rackSel.remove(1);
    rackOptions.forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v;
      rackSel.appendChild(o);
    });
    var uSel = document.getElementById('b-upos-default');
    while (uSel.options.length > 1) uSel.remove(1);
    uOptions.forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v;
      uSel.appendChild(o);
    });

    // Build per-item rows
    var html = scannedItems.map(function (item, i) {
      var uSelHtml = buildSelect('u-' + i, uOptions, '-- U 數 --');
      return '<div class="batch-item">' +
        '<div class="batch-item-header">' +
          '<div>' +
            '<div class="batch-item-barcode">' + esc(item.barcode) + '</div>' +
            (item.model ? '<div class="batch-item-model">' + esc(item.model) + '</div>' : '') +
          '</div>' +
        '</div>' +
        uSelHtml +
      '</div>';
    }).join('');
    document.getElementById('batch-items').innerHTML = html;
    document.getElementById('batch-err').textContent = '';
    showPage('pg-batch');
  }

  function applyDefaultU() {
    var def = document.getElementById('b-upos-default').value;
    if (!def) return;
    scannedItems.forEach(function (_, i) {
      var sel = document.getElementById('u-' + i);
      if (sel && !sel.value) sel.value = def;
    });
  }

  function submitBatch() {
    var engineer = document.getElementById('b-engineer').value.trim();
    var rack     = document.getElementById('b-rack').value;
    var errEl    = document.getElementById('batch-err');

    if (!engineer || !rack) {
      errEl.textContent = '⚠ 請填寫工程師姓名和機櫃編號';
      return;
    }

    // Validate all U positions
    for (var i = 0; i < scannedItems.length; i++) {
      var sel = document.getElementById('u-' + i);
      if (!sel || !sel.value) {
        errEl.textContent = '⚠ 請設定第 ' + (i + 1) + ' 個 GBIC 的 U 數（條碼：' + scannedItems[i].barcode + '）';
        return;
      }
    }
    errEl.textContent = '';

    // Submit all sequentially
    var promises = scannedItems.map(function (item, i) {
      return callApi({
        action:     'record',
        type:       currentAction,
        engineer:   engineer,
        barcode:    item.barcode,
        model:      item.model || '',
        rack:       rack,
        uPosition:  document.getElementById('u-' + i).value
      });
    });

    Promise.all(promises).then(function (results) {
      var failed = results.filter(function (r) { return !r.success; });
      document.getElementById('ok-title').textContent =
        currentAction + '成功（共 ' + scannedItems.length + ' 個）';
      document.getElementById('ok-detail').innerHTML =
        '<p><span class="lbl">機櫃：</span>' + esc(rack) + '</p>' +
        '<p><span class="lbl">工程師：</span>' + esc(engineer) + '</p>' +
        '<p><span class="lbl">動作：</span><span class="' +
          (currentAction === '領出' ? 'tag-out' : 'tag-in') + '">' + esc(currentAction) + '</span></p>' +
        (failed.length ? '<p style="color:#d93025">⚠ ' + failed.length + ' 筆送出失敗，請手動補登</p>' : '');
      showPage('pg-ok');
    }).catch(function () {
      errEl.textContent = '網路錯誤，請稍後再試';
    });
  }

  // ── Admin ───────────────────────────────────────────────────────
  function adminQueryRack() {
    var rack = document.getElementById('a-rack').value;
    if (!rack) return;
    callApi({ action: 'queryByRack', rack: rack }).then(function (data) {
      var el = document.getElementById('res-rack');
      if (!data.length) { el.innerHTML = '<p class="no-data">此機櫃目前無 GBIC 在外</p>'; return; }
      el.innerHTML = '<table>' +
        '<tr><th>U 數</th><th>條碼</th><th>型號</th><th>工程師</th><th>時間</th></tr>' +
        data.map(function (r) {
          return '<tr><td>' + esc(r.uPosition) + '</td><td>' + esc(r.barcode) + '</td>' +
            '<td>' + (r.model ? esc(r.model) : '—') + '</td><td>' + esc(r.engineer) + '</td>' +
            '<td>' + esc(fmtDate(r.timestamp)) + '</td></tr>';
        }).join('') + '</table>';
    }).catch(function () {
      document.getElementById('res-rack').innerHTML = '<p class="no-data">查詢失敗</p>';
    });
  }

  function adminQueryBarcode() {
    var barcode = document.getElementById('a-barcode').value.trim();
    if (!barcode) return;
    callApi({ action: 'queryByBarcode', barcode: barcode }).then(function (data) {
      var el = document.getElementById('res-barcode');
      if (!data.length) { el.innerHTML = '<p class="no-data">查無此條碼紀錄</p>'; return; }
      el.innerHTML = '<table>' +
        '<tr><th>時間</th><th>動作</th><th>機櫃</th><th>U 數</th><th>工程師</th></tr>' +
        data.map(function (r) {
          return '<tr><td>' + esc(fmtDate(r.timestamp)) + '</td>' +
            '<td class="' + (r.type === '領出' ? 'tag-out' : 'tag-in') + '">' + esc(r.type) + '</td>' +
            '<td>' + esc(r.rack) + '</td><td>' + esc(r.uPosition) + '</td>' +
            '<td>' + esc(r.engineer) + '</td></tr>';
        }).join('') + '</table>';
    }).catch(function () {
      document.getElementById('res-barcode').innerHTML = '<p class="no-data">查詢失敗</p>';
    });
  }

  function exportCSV() {
    callApi({ action: 'export' }).then(function (data) {
      var headers = ['條碼', '型號', '機櫃', 'U數', '狀態', '工程師', '最後操作時間'];
      var rows = data.map(function (r) {
        return [r.barcode, r.model, r.rack, r.uPosition, r.type, r.engineer, fmtDate(r.timestamp)];
      });
      var csv = [headers].concat(rows).map(function (row) {
        return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\r\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href = url;
      a.download = 'GBIC_庫存_' + new Date().toLocaleDateString('zh-TW').replace(/\//g, '-') + '.csv';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }).catch(function () { alert('匯出失敗，請稍後再試'); });
  }

  // ── Helpers ─────────────────────────────────────────────────────
  function fmtDate(ts) {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleString('zh-TW', { hour12: false }); }
    catch (e) { return String(ts); }
  }

  function callApi(payload) {
    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    }).then(function (r) { return r.json(); });
  }
</script>
</body>
</html>
